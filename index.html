<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training log</title>
<style>
  :root {
    --bg: #F7F5F0; --card: #FFFFFF; --ink: #1F1D1A; --ink-soft: #6B675F; --line: #E4E0D6;
    --done-bg: #E4EEE2; --done-line: #8FB88A; --done-ink: #2F5C33;
    --accent: #3B5B92; --accent-soft: #EDF1F8;
    --warm: #C47A2C; --warm-soft: #FBEEE4;
    --c-bike: #3B5B92; --c-z2: #5E9A58; --c-vo2: #C47A2C; --c-other: #9A8F7E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --card: #211F1C; --ink: #EDE9E1; --ink-soft: #A39E94; --line: #36332E;
      --done-bg: #1F2E20; --done-line: #5E8F59; --done-ink: #A9D3A4;
      --accent: #8CA8DA; --accent-soft: #232B3A; --warm: #E0A060; --warm-soft: #3A2C1E;
      --c-bike: #8CA8DA; --c-z2: #86BF7F; --c-vo2: #E0A060; --c-other: #8A8275;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    display: flex; justify-content: center; padding: 32px 16px 80px;
  }
  main { width: 100%; max-width: 480px; }
  .eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 4px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .tabs { display: flex; gap: 6px; margin: 20px 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tab-btn { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer; border: none; background: transparent; font-family: inherit; }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card.next { border-color: var(--accent); }
  .card h2 { font-size: 17px; margin: 2px 0 4px; font-weight: 600; }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .small { font-size: 12px; }
  .section-title { font-size: 14px; font-weight: 600; margin: 24px 0 10px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .pill.warm { background: var(--warm-soft); color: var(--warm); }
  .pill.done { background: var(--done-bg); color: var(--done-ink); }
  .btn { display: block; width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .btn { color: #111; } }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn + .btn { margin-top: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .ex-list { margin: 10px 0 12px; padding: 0; list-style: none; }
  .ex-list li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .ex-list li:first-child { border-top: none; }
  .ex-list .presc { color: var(--ink-soft); text-align: right; white-space: nowrap; }
  .exercise { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .exercise.complete { border-color: var(--done-line); background: var(--done-bg); }
  .ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .ex-name { font-weight: 600; font-size: 15px; }
  .ex-target { font-size: 12px; color: var(--ink-soft); text-align: right; }
  .ex-note { font-size: 12px; color: var(--warm); margin: -2px 0 6px; }
  .set-row { display: grid; grid-template-columns: 28px 1fr 1fr 40px; gap: 8px; align-items: center; padding: 4px 0; }
  .set-row .n { font-size: 12px; color: var(--ink-soft); text-align: center; }
  .set-row input, .field input, .field select, .field textarea, select.inline {
    width: 100%; font-family: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .set-row .unit { font-size: 11px; color: var(--ink-soft); }
  .chk { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: transparent; cursor: pointer; font-size: 16px; color: transparent; display: flex; align-items: center; justify-content: center; }
  .chk.on { background: var(--done-line); border-color: var(--done-line); color: #fff; }
  .ex-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 8px; }
  .link-btn { border: none; background: transparent; color: var(--accent); font-family: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; }
  .link-btn.danger { color: #B4473A; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .readiness { display: flex; gap: 6px; }
  .readiness button { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; font-size: 14px; cursor: pointer; }
  .readiness button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .quick button { padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit; font-size: 13px; cursor: pointer; }
  .quick button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .hist-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist-item:first-child { border-top: none; }
  .hist-item .meta { color: var(--ink-soft); font-size: 12px; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .stats { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .num { font-size: 22px; font-weight: 600; line-height: 1.1; }
  .stat .label { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 10px; }
  .chart-head select { font-family: inherit; font-size: 12px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--ink-soft); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .prog-sess { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .prog-sess:first-of-type { border-top: none; }
  .prog-sess.is-done { color: var(--ink-soft); }
  .prog-sess.is-next { font-weight: 600; color: var(--accent); }
  .phase-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.45; margin: 4px 0 8px; }
  .phase-desc b { color: var(--ink); font-weight: 600; }
  .max-row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; align-items: center; padding: 6px 0; }
  .max-row .hint { grid-column: 1 / -1; font-size: 12px; color: var(--ink-soft); margin-top: -2px; }
  #rest-bar { position: fixed; left: 50%; bottom: 12px; transform: translate(-50%, 150%); width: calc(100% - 24px); max-width: 456px;
    background: var(--ink); color: var(--bg); border-radius: 14px; overflow: hidden; transition: transform .2s; z-index: 10; }
  #rest-bar.show { transform: translate(-50%, 0); }
  #rest-bar.over { background: var(--done-line); color: #fff; }
  #rest-bar .rt-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(127,127,127,.25); transition: width .25s linear; }
  #rest-bar .rt-row { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  #rest-bar .rt-mid { flex: 1; text-align: center; }
  #rest-bar .rt-time { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #rest-bar .rt-name { font-size: 12px; opacity: .8; }
  #rest-bar button { background: rgba(127,127,127,.25); color: inherit; border: none; border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="today-label"></p>
    <h1>Training</h1>
    <p class="sub" id="header-sub"></p>
  </header>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="program">Program</button>
    <button class="tab-btn" data-tab="progress">Progress</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </nav>
  <section id="view"></section>
</main>
<div class="toast" id="toast"></div>
<div id="rest-bar">
  <div class="rt-fill"></div>
  <div class="rt-row">
    <button onclick="adjustRest(-15)">−15</button>
    <div class="rt-mid"><div class="rt-time"></div><div class="rt-name"></div></div>
    <button onclick="adjustRest(15)">+15</button>
    <button onclick="stopRest()">✕</button>
  </div>
</div>

<script>
/* ============================================================
   Storage
   ============================================================ */
const STORE_KEY = 'gabi-training-log';
const LB = 2.20462;

function defaultState() {
  return {
    settings: {
      unit: 'kg',
      inc: { kg: 2.5, lb: 5 },
      // working maxes, stored in kg. Prefilled from all-time bests; update after the ramp-up tests.
      maxes: { snatch: 61, cj: 70, bs: 97.5, fs: 83 },
    },
    sessions: [],   // {id, date, key, title, readiness, notes, exercises:[{name, rpe, note, sets:[{w(kg), r, done}]}]}
    cardio: [],     // {id, date, type, min, km, notes}
    measures: [],   // {id, date, waist, hips, thighL, thighR, calf, bicep, forearm, notes} in cm
    skipped: [],    // program keys
    draft: null,
    deleted: {},    // tombstones for sync: id -> ms
    settingsTs: 0, skippedTs: 0, lastSync: null, syncError: null,
  };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.settings) return Object.assign(defaultState(), s);
  } catch (e) {}
  return defaultState();
}
let state = load();
markSynced();
// remember the current settings / skipped list so save() can tell when they change
function markSynced() { state._settingsJson = JSON.stringify(state.settings); state._skippedJson = JSON.stringify(state.skipped); }
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
// save(): persist, and stamp settings / skipped list when they change so sync knows which side is newer
function save() {
  const st = JSON.stringify(state.settings), sk = JSON.stringify(state.skipped);
  let bumped = false;
  if (state._settingsJson !== undefined && st !== state._settingsJson) { state.settingsTs = Date.now(); bumped = true; }
  if (state._skippedJson !== undefined && sk !== state._skippedJson) { state.skippedTs = Date.now(); bumped = true; }
  state._settingsJson = st; state._skippedJson = sk;
  persist();
  if (bumped) scheduleSync();
}

/* ============================================================
   Cloud sync (Supabase, same project as the habits app)
   Table training_items: one row per session / cardio entry, plus 'settings' and 'skipped'.
   client_ts (ms) decides which side is newer; deletes are tombstone rows.
   ============================================================ */
const SUPABASE_URL = 'https://mghqfyjckbzhyefpzkaq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BVJz5Rcer9rJlP-AcVPp0A_n0-UAK6z';
const TABLE = SUPABASE_URL + '/rest/v1/training_items';
const HDR = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
let syncing = false, syncTimer = null;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncAll, 800); }

function localItems() {
  const m = {};
  const add = (list, kind) => list.forEach(x => {
    const { _ts, ...data } = x;
    m[x.id] = { id: x.id, kind, date: x.date, data, deleted: false, client_ts: _ts || 1 };
  });
  add(state.sessions, 'session');
  add(state.cardio, 'cardio');
  add(state.measures, 'measure');
  m.settings = { id: 'settings', kind: 'settings', date: null, data: state.settings, deleted: false, client_ts: state.settingsTs || 0 };
  m.skipped = { id: 'skipped', kind: 'skipped', date: null, data: state.skipped, deleted: false, client_ts: state.skippedTs || 0 };
  Object.entries(state.deleted || {}).forEach(([id, ts]) => {
    if (!m[id]) m[id] = { id, kind: 'deleted', date: null, data: null, deleted: true, client_ts: ts };
  });
  return m;
}
function applyRemote(r) {
  const ts = Number(r.client_ts);
  if (r.deleted) {
    state.sessions = state.sessions.filter(s => s.id !== r.id);
    state.cardio = state.cardio.filter(c => c.id !== r.id);
    state.measures = state.measures.filter(c => c.id !== r.id);
    state.deleted[r.id] = ts;
    return;
  }
  if (r.kind === 'settings') {
    const d = defaultState().settings;
    state.settings = Object.assign(d, r.data, { inc: Object.assign(d.inc, (r.data || {}).inc), maxes: Object.assign(d.maxes, (r.data || {}).maxes) });
    state.settingsTs = ts; state._settingsJson = JSON.stringify(state.settings);
    return;
  }
  if (r.kind === 'skipped') {
    state.skipped = r.data || []; state.skippedTs = ts; state._skippedJson = JSON.stringify(state.skipped);
    return;
  }
  const list = r.kind === 'session' ? state.sessions : r.kind === 'cardio' ? state.cardio : r.kind === 'measure' ? state.measures : null;
  if (!list) return;
  const item = Object.assign({}, r.data, { _ts: ts });
  const i = list.findIndex(x => x.id === r.id);
  if (i >= 0) list[i] = item; else list.push(item);
  list.sort((a, b) => a.date.localeCompare(b.date));
}
async function syncAll() {
  if (syncing) { scheduleSync(); return; }
  syncing = true;
  try {
    const res = await fetch(TABLE + '?select=id,kind,date,data,deleted,client_ts', { headers: HDR });
    if (!res.ok) throw new Error(res.status === 404 ? 'table training_items not found. Run the SQL in SETUP.md' : 'download failed (HTTP ' + res.status + ')');
    const remote = await res.json();
    const rmap = {}; remote.forEach(r => rmap[r.id] = r);
    const loc = localItems();
    let changed = false;
    remote.forEach(r => {
      const l = loc[r.id];
      if (Number(r.client_ts) > (l ? l.client_ts : -1)) { applyRemote(r); changed = true; }
    });
    const push = Object.values(localItems()).filter(l => { const r = rmap[l.id]; return !r || l.client_ts > Number(r.client_ts); });
    if (push.length) {
      const p = await fetch(TABLE + '?on_conflict=id', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, HDR),
        body: JSON.stringify(push),
      });
      if (!p.ok) throw new Error('upload failed (HTTP ' + p.status + ')');
    }
    state.lastSync = Date.now(); state.syncError = null;
    persist();
    if ((changed && !state.draft) || tab === 'settings') render();
  } catch (e) {
    state.syncError = String(e && e.message || e); persist();
    if (tab === 'settings') render();
  } finally { syncing = false; }
}

/* ============================================================
   Units
   ============================================================ */
const U = () => state.settings.unit;
const toDisp = kg => U() === 'kg' ? kg : kg * LB;
const toKg = v => U() === 'kg' ? v : v / LB;
function roundDisp(v) { const inc = state.settings.inc[U()]; return Math.round(v / inc) * inc; }
function fmt(kg, round) {
  if (kg == null || isNaN(kg)) return '';
  const v = toDisp(kg);
  const r = round ? roundDisp(v) : Math.round(v * 10) / 10;
  return (Math.round(r * 10) / 10).toString();
}
const MAX_NAMES = { snatch: 'Snatch', cj: 'Clean & jerk', bs: 'Back squat', fs: 'Front squat' };

/* ============================================================
   Program
   Exercise prescription: {n, s, r, pct?, of?, rpe?, note?}
   r may be a number or a string ("8/leg", "1+1", "30s", "max").
   ============================================================ */
const LEGS = new Set(['Back squat','Front squat','Bulgarian split squat','Hip thrust','Romanian deadlift',
  'Banded glute bridge','Single-leg glute bridge','Banded lateral walk','Banded clamshell','Banded kickback','Frog pump',
  'Walking lunge','Goblet squat','Single-leg DB RDL','DB calf raise','Good morning','DB step-up','Cable leg curl','Cable pull-through','Cable kickback','GHD hip extension','Sled push','Kettlebell swing','Overhead squat','Pause back squat']);

// GHD sit-ups: start conservative, they can make abs very sore at first
function ghdSitup(week0) {
  return week0 === 0
    ? { n: 'GHD sit-up', s: 2, r: 8, note: 'First week: short range (to parallel), well short of failure. They can make abs very sore at first.' }
    : { n: 'GHD sit-up', s: 3, r: 10 };
}

function rampSessions() {
  const out = [];
  const wk = [
    { bs: 'RPE 6 — smooth, find depth', fs: 'RPE 6', rpe: '6' },
    { bs: 'RPE 7', fs: 'RPE 7', rpe: '7' },
    { bs: 'TEST: work up to a heavy triple @ RPE 8–9', fs: 'TEST: work up to a heavy triple @ RPE 8–9', rpe: '8' },
  ];
  wk.forEach((w, i) => {
    const t = i === 2;
    out.push({ title: 'Snatch + squat', ex: [
      { n: 'Box jump', s: 4, r: 2, note: 'For height. Full reset between jumps, step down.' },
      { n: 'Hang power snatch', s: 5, r: 3, rpe: '6', note: 'Above the knee. Positions, not weight.' },
      { n: 'Snatch pull', s: 3, r: 3, rpe: '7' },
      t ? { n: 'Back squat', s: 1, r: 3, note: w.bs } : { n: 'Back squat', s: 4, r: i ? 5 : 6, rpe: w.rpe, note: 'Small plates under heels until the shoes arrive.' },
      { n: 'Bulgarian split squat', s: 3, r: '8/leg', rpe: '8' },
      { n: 'Hip thrust', s: 3, r: 10, rpe: '8' },
      ghdSitup(i),
    ]});
    out.push({ title: 'Clean + hinge', ex: [
      { n: 'Box jump', s: 4, r: 2, note: 'For height. Full reset between jumps, step down.' },
      { n: 'Hang power clean', s: 5, r: 3, rpe: '6' },
      { n: 'Push press', s: 4, r: 4, rpe: '7' },
      { n: 'Clean pull', s: 3, r: 3, rpe: '7' },
      { n: 'Romanian deadlift', s: 3, r: 8, rpe: '7' },
      { n: 'Walking lunge', s: 3, r: '10/leg', rpe: '8' },
      { n: 'GHD hip extension', s: 3, r: 12, rpe: '8', note: 'Hips on the pad, squeeze glutes at the top. Hold a plate when it gets easy.' },
    ]});
    out.push({ title: 'Front squat + jerk + glutes', ex: [
      { n: 'Overhead squat', s: 4, r: 3, rpe: '6', note: 'Light. Mobility + position.' },
      t ? { n: 'Front squat', s: 1, r: 3, note: w.fs } : { n: 'Front squat', s: 4, r: 5, rpe: w.rpe },
      { n: 'Push jerk', s: 5, r: 2, rpe: '7' },
      { n: 'Hip thrust', s: 4, r: 8, rpe: '8', note: 'Heavy. Pause 1s at the top.' },
      { n: 'Cable leg curl', s: 3, r: '12/leg', rpe: '8', note: 'Standing, ankle strap. No strap? Single-leg DB RDL instead.' },
      { n: 'Sled push', s: 4, r: '20m', note: 'Heavy enough to be a grind, not a sprint. Rest ~90s.' },
      ghdSitup(i),
    ]});
  });
  return out.map((s, i) => Object.assign(s, { week: Math.floor(i / 3) + 1 }));
}

function decSessions() {
  const pcts = [0.70, 0.73, 0.76, 0.78, 0.65];
  const out = [];
  pcts.forEach((p, i) => {
    const wk = i + 1, light = i === 4;
    out.push({ week: wk, title: 'Snatch + back squat', ex: [
      { n: 'Box jump', s: 3, r: 2, note: 'For height. Full reset between jumps, step down.' },
      { n: 'Snatch', s: 5, r: 2, pct: p, of: 'snatch' },
      { n: 'Back squat', s: 5, r: 5, pct: p, of: 'bs' },
      { n: 'Hip thrust', s: 3, r: 10, rpe: '8' },
      { n: 'GHD sit-up', s: 3, r: 10 },
    ]});
    out.push({ week: wk, title: 'C&J + front squat', ex: [
      { n: 'Clean & jerk', s: 5, r: '1+1', pct: p, of: 'cj' },
      { n: 'Front squat', s: 4, r: 4, pct: p, of: 'fs' },
      { n: 'Romanian deadlift', s: 3, r: 8, rpe: '7' },
      { n: 'GHD sit-up', s: 3, r: 10 },
    ]});
    out.push({ week: wk, optional: true, title: 'Legs & glutes pump', ex: [
      { n: 'Bulgarian split squat', s: 3, r: '10/leg', rpe: '8' },
      { n: 'Goblet squat', s: 3, r: 15, rpe: '8', note: 'Heels on plates, slow down.' },
      { n: 'Hip thrust', s: 3, r: 12, rpe: '8' },
      { n: 'Kettlebell swing', s: 4, r: 15, note: 'Hip snap, not a squat. Squeeze glutes hard at the top.' },
      { n: 'Cable kickback', s: 2, r: '12/leg', rpe: '9' },
      { n: 'DB calf raise', s: 3, r: 15, note: 'One leg at a time, on a plate.' },
      { n: 'Sled push', s: 4, r: '20m', note: 'Finisher. Heavy, steady.' },
    ]});
    if (light) out.slice(-3).forEach(s => s.title += ' (deload)');
  });
  return out;
}

// Leg size block (hypertrophy) — 5 weeks x 3. Weeks 1–4 build volume (% of working maxes, accessories
// close to failure); week 5 = lighter accessories + squat tests that set the maxes for the Russian block.
function sizeSessions() {
  const bs = [[3,10,.65],[4,10,.65],[4,8,.70],[5,8,.70]];
  const fs = [[3,8,.65],[4,8,.65],[4,8,.68],[4,8,.70]];
  const out = [];
  for (let w = 0; w < 5; w++) {
    const t = w === 4, acc = t ? 2 : (w < 2 ? 3 : 4);
    const test = 'TEST: work up to a heavy single @ RPE 9 (or a triple). Sets the max for the Russian block.';
    out.push({ week: w + 1, title: t ? 'Snatch + back squat TEST' : 'Snatch + back squat', ex: [
      { n: 'Box jump', s: 3, r: 2, note: 'For height. Full reset between jumps, step down.' },
      { n: 'Snatch', s: 5, r: 2, pct: 0.65, of: 'snatch', note: 'Technique. Crisp and fast.' },
      t ? { n: 'Back squat', s: 1, r: 1, note: test }
        : { n: 'Back squat', s: bs[w][0], r: bs[w][1], pct: bs[w][2], of: 'bs', note: 'Controlled down, 1–2 reps left in the tank on the last set.' },
      { n: 'Bulgarian split squat', s: acc, r: '10/leg', rpe: t ? '7' : '9' },
      { n: 'Hip thrust', s: acc, r: 12, rpe: t ? '7' : '9', note: 'Pause 1s at the top.' },
      { n: 'GHD sit-up', s: 3, r: 12 },
    ]});
    out.push({ week: w + 1, title: 'C&J + hinge', ex: [
      { n: 'Clean & jerk', s: 5, r: '1+1', pct: 0.65, of: 'cj', note: 'Technique.' },
      { n: 'Romanian deadlift', s: acc, r: 10, rpe: t ? '7' : '8', note: 'Slow down, big hamstring stretch.' },
      { n: 'Walking lunge', s: t ? 2 : 3, r: '12/leg', rpe: t ? '7' : '9' },
      { n: 'Cable leg curl', s: 3, r: '12/leg', rpe: t ? '7' : '9', note: 'Standing, ankle strap.' },
      { n: 'GHD hip extension', s: 3, r: 15, rpe: t ? '7' : '9' },
      { n: 'DB calf raise', s: 3, r: 15, note: 'One leg at a time, on a plate. Pause in the stretch.' },
    ]});
    out.push({ week: w + 1, title: t ? 'Front squat TEST + glutes' : 'Front squat + glutes', ex: [
      { n: 'Power clean', s: 5, r: 2, pct: 0.65, of: 'cj', note: 'Fast. Technique, not weight.' },
      t ? { n: 'Front squat', s: 1, r: 1, note: test.replace(' Sets the max for the Russian block.', '') }
        : { n: 'Front squat', s: fs[w][0], r: fs[w][1], pct: fs[w][2], of: 'fs' },
      { n: 'Hip thrust', s: acc, r: 8, rpe: t ? '7' : '9', note: 'Heavy. Pause 1s at the top.' },
      { n: 'Goblet squat', s: t ? 2 : 3, r: 15, rpe: t ? '7' : '9', note: 'Heels on plates, slow down, no pause at the top.' },
      { n: 'Cable kickback', s: 2, r: '12/leg', rpe: '9' },
      { n: 'Sled push', s: t ? 3 : 4, r: '20m', note: 'Finisher. Heavy, steady.' },
    ]});
  }
  return out;
}

// Russian Squat Routine — 6 weeks x 3, % of back squat max
const RSR = [
  [[6,2,.80],[6,3,.80],[6,2,.80]],
  [[6,4,.80],[6,2,.80],[6,5,.80]],
  [[6,2,.80],[6,6,.80],[6,2,.80]],
  [[5,5,.85],[6,2,.80],[4,4,.90]],
  [[6,2,.80],[3,3,.95],[6,2,.80]],
  [[2,2,1.00],[6,2,.80],[1,1,1.05]],
];
function rsrSessions() {
  const oly = [0.70, 0.72, 0.75, 0.75, 0.72, 0.70];
  const out = [];
  RSR.forEach((wk, w) => {
    const late = w >= 4;
    wk.forEach(([s, r, p], d) => {
      const squat = { n: 'Back squat', s, r, pct: p, of: 'bs',
        note: p > 1 ? 'New max attempt. Belt + good warm-up.' : (s * r >= 30 ? 'The big one. Rest 3–4 min between sets.' : '') };
      const jumps = { n: 'Box jump', s: late ? 3 : 4, r: 2, note: 'For height. Full reset between jumps, step down.' };
      if (d === 0) out.push({ week: w + 1, title: 'Snatch + squat', ex: [
        jumps,
        { n: 'Snatch', s: 6, r: 2, pct: oly[w], of: 'snatch' },
        squat,
        { n: 'Hip thrust', s: late ? 3 : 4, r: 8, rpe: '8' },
        { n: 'Cable leg curl', s: 3, r: '12/leg', rpe: '8', note: 'Standing, ankle strap.' },
        { n: 'GHD sit-up', s: 3, r: 12 },
      ]});
      if (d === 1) out.push({ week: w + 1, title: 'C&J + squat', ex: [
        { n: 'Clean & jerk', s: 5, r: '1+1', pct: oly[w], of: 'cj' },
        squat,
        { n: 'Romanian deadlift', s: 3, r: 6, rpe: '7' },
        { n: 'Strict press', s: 3, r: 8, rpe: '8' },
        { n: 'Seated cable row', s: 3, r: 10 },
        { n: 'Pull-up', s: 3, r: 'max' },
        { n: 'GHD sit-up', s: 3, r: 12 },
      ]});
      if (d === 2) out.push({ week: w + 1, title: 'Power lifts + squat', ex: [
        jumps,
        { n: 'Power snatch', s: 5, r: 2, pct: 0.65, of: 'snatch' },
        { n: 'Power clean & jerk', s: 4, r: '1+1', pct: 0.65, of: 'cj' },
        squat,
        { n: 'Hip thrust', s: 3, r: 12, rpe: '8' },
        { n: 'GHD hip extension', s: 3, r: 12, rpe: '8' },
      ]});
    });
  });
  return out;
}

const PHASES = [
  { id: 'ramp', name: 'Ramp-up', when: 'Nov 11 – Nov 30 · no lifting shoes yet', sessions: rampSessions(),

PHASES.forEach(ph => ph.sessions.forEach((s, i) => { s.key = ph.id + ':' + i; s.phase = ph; }));
const ALL = PHASES.flatMap(ph => ph.sessions);
// Optional home session (bands + core): not part of the queue, doesn't move the program forward.
// Key stays 'home:bands' so sessions logged before the rename still match.
const HOME_BANDS = { key: 'home:bands', home: true, title: 'Home: glutes + abs', phase: { name: 'Home' }, ex: [

  { n: 'Frog pump', s: 2, r: '25–30', note: 'Soles together, knees out, short fast reps. Go to the burn.' },

const ARMS = { key: 'extra:arms', extra: true, title: 'Gym: arms', phase: { name: 'Extra' }, ex: [
  { n: 'Single-arm cable pulldown', s: 3, r: '10–12/arm', rpe: '8', note: 'Half-kneeling, pull elbow down to your ribs. Builds toward pull-ups.' },

]};
// Exercises suggested in the free session's "Add exercise" list (park bars, bodyweight, etc.)
const EXTRA_NAMES = ['Dip','Pull-up','Australian pull-up','L-sit','Push-up','Hanging knee raise','Pistol squat','Jump squat','Plank'];
const BY_KEY = Object.fromEntries(ALL.concat([HOME_BANDS, ARMS]).map(s => [s.key, s]));

function doneMap() { const m = {}; state.sessions.forEach(s => { if (s.key) m[s.key] = s.date; }); return m; }
function nextSession() {
  const d = doneMap();
  return ALL.find(s => !d[s.key] && !state.skipped.includes(s.key));
}
function prescText(e) {
  let t = e.s + '×' + e.r;
  if (e.pct) {
    const max = state.settings.maxes[e.of];
    t += ' @ ' + Math.round(e.pct * 100) + '%';
    if (max) t += ' · ' + fmt(e.pct * max, true) + ' ' + U();
  } else if (e.rpe) t += ' @ RPE ' + e.rpe;
  return t;
}

// Rough session length (min): warm-up + per set (work + rest). Rest grows with intensity,
// so heavy squat days come out longer. Calibrated on session 1 (actual 55 min at low RPE).
// Rest between sets (minutes): longer for heavier squats, short for accessories.
function restMin(e) {
  const n = e.n, r = String(e.r);
  if (n === 'Box jump') return 1;
  if (/^Banded|^Frog|^Single-leg glute|^Dead bug|^Side plank|^Hollow/.test(n)) return 0.75;
  if (/m$/.test(r)) return 1.5;
  if (n === 'Back squat' || n === 'Front squat') {
    if (e.s === 1) return 3;
    const p = e.pct || (parseFloat(e.rpe) >= 8 ? 0.8 : 0.7);
    return p >= 0.9 ? 4 : p >= 0.8 ? 3 : 2;
  }
  if (/snatch|clean|jerk|push press|pull$/i.test(n)) return 1.75;
  return 1.25;
}
function restLabel(sec) { return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

function estMin(sess) {
  let t = sess.home ? 3 : 10;
  sess.ex.forEach(e => {
    const n = e.n, r = String(e.r), reps = repsNum(e.r) || 5;
    let work = 0.5; const rest = restMin(e);
    if (/snatch|clean|jerk|push press|pull$/i.test(n) && e.pct && !/pull$/i.test(n)) t += 4;
    if (n === 'Back squat' || n === 'Front squat') {
      if (e.s === 1) { t += 15; return; }                  // work up to a heavy single/triple
      const p = e.pct || (parseFloat(e.rpe) >= 8 ? 0.8 : 0.7);
      work = 0.3 + 0.12 * reps;
      if (p >= 0.7) t += 6;                                // warm-up sets
    }
    if (n === 'Box jump') work = 0.3;
    if (/\/(leg|side|arm)/.test(r)) work *= 2;
    t += e.s * (work + rest);
  });
  return Math.round(t / 5) * 5;
}

/* ============================================================
   Helpers
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function niceDate(iso) { const d = new Date(iso + 'T12:00'); return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function weekStart(iso) { const d = new Date(iso + 'T12:00'); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.toISOString().slice(0, 10); }
const repsNum = r => { const n = parseInt(r, 10); return isNaN(n) ? 0 : n; };
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);

function lastWeightFor(name) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const ex = state.sessions[i].exercises.find(e => e.name === name);
    if (ex) { const done = ex.sets.filter(s => s.done && s.w); if (done.length) return Math.max(...done.map(s => s.w)); }
  }
  return null;
}

/* ============================================================
   Session drafting / logging
   ============================================================ */
function startSession(key) {
  const tpl = key ? BY_KEY[key] : null;
  state.draft = {
    id: uid(), key: key || null, title: tpl ? tpl.title : 'Freestyle',
    phaseName: tpl ? (tpl.home ? 'Home · optional extra' : tpl.extra ? 'Optional extra' : tpl.phase.name + ' · week ' + tpl.week) : 'Freestyle · log anything',
    date: todayISO(), readiness: null, notes: '',
    exercises: tpl ? tpl.ex.map(e => {
      let w = null;
      if (e.pct && state.settings.maxes[e.of]) w = toKg(roundDisp(toDisp(e.pct * state.settings.maxes[e.of])));
      else w = lastWeightFor(e.n);
      return { name: e.n, target: prescText(e), note: e.note || '', rpe: '', rest: Math.round(restMin(e) * 4) * 15,
        sets: Array.from({ length: e.s }, () => ({ w, r: String(e.r), done: false })) };
    }) : [],
  };
  save(); render();
  window.scrollTo(0, 0);
}

function finishSession() {
  const d = state.draft;
  d.exercises.forEach(e => e.sets.forEach(s => { if (s.w === '') s.w = null; }));
  const rec = { _ts: Date.now(), id: d.id, date: d.date, key: d.key, title: d.title, readiness: d.readiness, notes: d.notes,
    exercises: d.exercises.map(e => ({ name: e.name, rpe: e.rpe, sets: e.sets })) };
  state.sessions.push(rec);
  state.sessions.sort((a, b) => a.date.localeCompare(b.date));
  state.draft = null;
  save(); scheduleSync();
  const prs = detectPRs(rec);
  toast(prs.length ? 'Saved. New best: ' + prs.join(', ') + ' 🎉' : 'Session saved 💪');
  render();
}

function detectPRs(rec) {
  const out = [];
  for (const [k, name] of Object.entries(MAX_NAMES)) {
    const ex = rec.exercises.find(e => e.name === name); if (!ex) continue;
    const cur = bestFrom([ex], k); if (!cur) continue;
    const prev = state.sessions.filter(s => s.id !== rec.id).flatMap(s => s.exercises.filter(e => e.name === name));
    const p = bestFrom(prev, k);
    if (!p || cur > p + 0.01) out.push(name);
  }
  return out;
}
// squats → best e1RM; snatch/C&J → heaviest completed
function bestFrom(exs, k) {
  let b = 0;
  exs.forEach(e => e.sets.forEach(s => {
    if (!s.done || !s.w) return;
    const v = (k === 'bs' || k === 'fs') ? (repsNum(s.r) <= 10 ? e1rm(s.w, repsNum(s.r)) : 0) : s.w;
    if (v > b) b = v;
  }));
  return b;
}

/* ============================================================

   so it stays right if the phone locks; the beep only plays while the app is open.
   ============================================================ */
let restEnd = 0, restTotal = 0, restName = '', restTick = null, restDoneAt = 0, audioCtx = null;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}

  try {
    if (!audioCtx) return;
    [0, 0.25, 0.5].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + d;
      g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);

}

  clearInterval(restTick); restTick = setInterval(drawRest, 250); drawRest();
}

function drawRest() {
  const bar = document.getElementById('rest-bar');

  const left = Math.ceil((restEnd - Date.now()) / 1000);
  bar.classList.add('show');
  if (left <= 0) {
    if (!restDoneAt) { restDoneAt = Date.now(); beep(); }
    bar.classList.add('over');
    bar.querySelector('.rt-time').textContent = 'Go!';
    bar.querySelector('.rt-name').textContent = 'Rest over · next set of ' + restName;
    bar.querySelector('.rt-fill').style.width = '100%';
    if (Date.now() - restDoneAt > 15000) stopRest();

  }
  bar.classList.remove('over');
  bar.querySelector('.rt-time').textContent = restLabel(left);
  bar.querySelector('.rt-name').textContent = 'Rest · ' + restName;
  bar.querySelector('.rt-fill').style.width = (100 * (1 - left / restTotal)).toFixed(1) + '%';
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && restEnd) drawRest(); });

function lineChart(pts, refKg, opt) {
  const cv = opt && opt.raw ? (v => v) : toDisp;
  const lab = opt && opt.raw ? (v => v + ' ' + opt.unit) : (v => fmt(v) + ' ' + U());
  if (pts.length < 1) return `<div class="empty">${opt && opt.empty || 'Log a session with this lift to see the trend.'}</div>`;
  const W = 440, H = 180, P = { l: 34, r: 10, t: 12, b: 22 };
  const xs = pts.map(p => new Date(p.date + 'T12:00').getTime());
  const ys = pts.map(p => cv(p.v));
  if (refKg) ys.push(cv(refKg));
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max(2, (y1 - y0) * 0.15); y0 -= pad; y1 += pad;
  const sx = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r);
  const sy = y => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + sx(xs[i]).toFixed(1) + ' ' + sy(cv(p.v)).toFixed(1)).join(' ');
  let g = '';
  [y0 + pad, (y0 + y1) / 2, y1 - pad].forEach(v => {
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="2" y="${sy(v) + 3}" font-size="10" fill="var(--ink-soft)">${Math.round(v)}</text>`;
  });
  if (refKg) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${sy(cv(refKg))}" y2="${sy(cv(refKg))}" stroke="var(--warm)" stroke-dasharray="4 4"/>
    <text x="${W - P.r}" y="${sy(cv(refKg)) - 4}" font-size="10" fill="var(--warm)" text-anchor="end">working max</text>`;
  const fd = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  g += `<text x="${P.l}" y="${H - 4}" font-size="10" fill="var(--ink-soft)">${fd(x0)}</text><text x="${W - P.r}" y="${H - 4}" font-size="10" fill="var(--ink-soft)" text-anchor="end">${fd(x1)}</text>`;
  const dots = pts.map((p, i) => `<circle cx="${sx(xs[i]).toFixed(1)}" cy="${sy(cv(p.v)).toFixed(1)}" r="3.5" fill="var(--accent)"><title>${p.date}: ${lab(p.v)}</title></circle>`).join('');

}

  return out;
}
function barChart(wks, stacks, colors) {
  const W = 440, H = 150, P = { l: 30, r: 6, t: 10, b: 20 };
  const tot = wks.map((_, i) => stacks.reduce((a, s) => a + s[i], 0));
  const mx = Math.max(1, ...tot);
  const bw = (W - P.l - P.r) / wks.length;

  wks.forEach((w, i) => {

  if (!any) { toast('Enter at least one measurement'); return; }
  state.measures.push(rec); state.measures.sort((a, b) => a.date.localeCompare(b.date));
  measureOpen = false; save(); scheduleSync(); toast('Measurements saved'); render();
}
function delMeasure(id) {
  if (!confirm('Delete these measurements?')) return;
  state.measures = state.measures.filter(m => m.id !== id); state.deleted[id] = Date.now(); save(); scheduleSync(); render();
}

/* ============================================================
   Render: Settings
   ============================================================ */
function renderSettings() {
  const m = state.settings.maxes;
  let h = `<div class="card"><h2>Units</h2>
    <div class="quick" style="grid-template-columns:1fr 1fr;margin-top:8px">
      ${['kg','lb'].map(u => `<button class="${U() === u ? 'sel' : ''}" onclick="state.settings.unit='${u}';save();render()">${u}</button>`).join('')}
    </div>
    <div class="field" style="margin-top:10px"><label>Round prescribed weights to (${U()})</label>
      <input type="number" step="0.5" value="${state.settings.inc[U()]}" onchange="state.settings.inc[U()]=parseFloat(this.value)||1;save();render()"></div>
  </div>
  <div class="card"><h2>Working maxes</h2><p class="muted">Program percentages are based on these. They start from your all-time bests (135 lb snatch, 155 lb C&J, 215 lb squat) and a front squat estimate. Update them after the week-3 ramp-up tests.</p>`;
  Object.entries(MAX_NAMES).forEach(([k, n]) => {
    const best = bestFrom(state.sessions.flatMap(s => s.exercises.filter(e => e.name === n)), k);
    h += `<div class="max-row"><label>${n}</label>
      <input type="number" step="any" inputmode="decimal" value="${fmt(m[k])}" onchange="state.settings.maxes['${k}']=toKg(parseFloat(this.value));save();render()" style="font-family:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">
      ${best ? `<span class="hint">From your log: ${fmt(best)} ${U()}${k === 'bs' || k === 'fs' ? ' (e1RM)' : ''} · <button class="link-btn" onclick="state.settings.maxes['${k}']=${best};save();render();toast('Max updated')">use this</button></span>` : ''}
    </div>`;
  });
  h += `</div>
  <div class="card"><h2>Cloud sync</h2>
    <p class="muted">${state.syncError ? '⚠️ ' + esc(state.syncError)
      : state.lastSync ? 'Synced ' + new Date(state.lastSync).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      : 'Not synced yet.'}</p>
    <button class="btn secondary" onclick="syncAll()">Sync now</button>
  </div>
  <div class="card"><h2>Backup</h2><p class="muted">Everything also syncs to the cloud. A JSON export is an extra copy you keep yourself.</p>
    <button class="btn secondary" onclick="exportData()">Export JSON</button>
    <button class="btn ghost" onclick="$('#imp').click()">Import JSON</button>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this.files[0])">
  </div>`;
  return h;
}
function exportData() {
  const b = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'training-' + todayISO() + '.json'; a.click();
}
function importData(f) {
  if (!f) return;
  f.text().then(t => {
    try { const s = JSON.parse(t); if (!s.settings) throw 0; if (!confirm('Replace all current data with this file?')) return;
      state = Object.assign(defaultState(), s); markSynced();
      const now = Date.now();
      state.sessions.forEach(x => x._ts = now); state.cardio.forEach(x => x._ts = now); state.measures.forEach(x => x._ts = now);
      state.settingsTs = now; state.skippedTs = now;
      save(); scheduleSync(); render(); toast('Imported'); }
    catch (e) { toast('Not a valid backup file'); }
  });
}

/* ============================================================
   Shell
   ============================================================ */
function setTabs() { document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab)); }
function render() {
  $('#today-label').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const n = nextSession();
  $('#header-sub').textContent = n ? n.phase.name + ' · week ' + n.week : 'Program complete';
  setTabs();
  $('#view').innerHTML = { today: renderToday, program: renderProgram, progress: renderProgress, settings: renderSettings }[tab]();
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
render();
syncAll();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncAll(); });
</script>
</body>
</html>
